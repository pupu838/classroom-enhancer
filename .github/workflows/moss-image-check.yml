name: Moss Tencent image readiness
on:
  push:
    branches: [cloud-pipeline-v0.5]
    paths: ['cloud/Moss.Dockerfile*', 'cloud/moss_*.py', 'cloud/moss-requirements.txt', '.github/workflows/moss-image-check.yml', 'scripts/check-moss-image.py', 'scripts/push-moss-oci.py']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: moss-tencent-private-image
  cancel-in-progress: false
jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          file: cloud/Moss.Dockerfile
          platforms: linux/amd64
          tags: classroom-moss:check
          load: true
          push: false
      - name: Verify SCF listener and auth without starting a model
        shell: bash
        run: |
          set -euo pipefail
          token=$(openssl rand -hex 32)
          echo "::add-mask::$token"
          docker run -d --name moss-check -p 127.0.0.1:9000:9000 -e CE_MOSS_TOKEN="$token" classroom-moss:check
          python - <<'PY'
          import json, time, urllib.request, urllib.error
          for attempt in range(60):
              try:
                  urllib.request.urlopen(urllib.request.Request('http://127.0.0.1:9000/enhance', data=b'{}', headers={'Content-Type':'application/json'}), timeout=1)
                  raise AssertionError('Unauthenticated request unexpectedly accepted')
              except urllib.error.HTTPError as exc:
                  assert exc.code == 401, exc.code
                  print('SCF port 9000: unauthorized request rejected before GPU initialization')
                  break
              except (urllib.error.URLError, OSError):
                  time.sleep(.4)
          else:
              raise AssertionError('SCF listener not ready within 24 seconds')
          PY
          status=$(curl -sS -o /tmp/moss-invalid.json -w '%{http_code}' -X POST -H "Authorization: Bearer $token" -H 'Content-Type: application/json' --data '{}' http://127.0.0.1:9000/enhance)
          test "$status" = 400
          status=$(curl -sS -o /tmp/moss-cam-invalid.json -w '%{http_code}' -X POST -H 'Authorization: TC3-HMAC-SHA256 smoke-check' -H "X-CE-Moss-Token: $token" -H 'Content-Type: application/json' --data '{}' http://127.0.0.1:9000/enhance)
          test "$status" = 400
          docker stop moss-check
      - name: Measure compressed OCI layers against documented SCF default limit
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          docker buildx build --platform linux/amd64 -f cloud/Moss.Dockerfile --provenance=false --output type=oci,dest=/tmp/moss-image.tar .
          python scripts/check-moss-image.py /tmp/moss-image.tar /tmp/moss-image-readiness.json
          cat /tmp/moss-image-readiness.json
          cat /tmp/moss-image-readiness.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        with:
          name: moss-tencent-image-readiness
          path: /tmp/moss-image-readiness.json
          retention-days: 14
      - name: Push pinned image without deploying or invoking a GPU
        if: ${{ success() && vars.CE_TCR_IMAGE != '' }}
        timeout-minutes: 30
        env:
          CE_TCR_IMAGE: ${{ vars.CE_TCR_IMAGE }}
          CE_TCR_USERNAME: ${{ secrets.CE_TCR_USERNAME }}
          CE_TCR_PASSWORD: ${{ secrets.CE_TCR_PASSWORD }}
        run: |
          case "$CE_TCR_IMAGE" in
            ccr.ccs.tencentyun.com/*/*) ;;
            *) echo 'Only the configured Tencent personal registry is allowed'; exit 1 ;;
          esac
          python -m pip install --disable-pip-version-check httpx==0.28.1
          python scripts/push-moss-oci.py /tmp/moss-image.tar "$CE_TCR_IMAGE:$GITHUB_SHA" /tmp/moss-registry-transfer.json
          echo "Private Tencent image uploaded for commit $GITHUB_SHA; no SCF function created or GPU invoked." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: ${{ success() && vars.CE_TCR_IMAGE != '' }}
        with:
          name: moss-private-registry-transfer
          path: /tmp/moss-registry-transfer.json
          retention-days: 14
      - name: Cleanup
        if: always()
        run: |
          docker logs moss-check || true
          docker rm -f moss-check || true
