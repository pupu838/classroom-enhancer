name: Moss Tencent image readiness
on:
  push:
    branches: [cloud-pipeline-v0.5]
    paths: ['cloud/Moss.Dockerfile*', 'cloud/moss_*.py', 'cloud/moss-requirements.txt', '.github/workflows/moss-image-check.yml', 'scripts/check-moss-image.py', 'scripts/push-moss-oci.py']
  workflow_dispatch:
    inputs:
      readiness_only:
        description: 'Build, dependency, listener and size checks only; no registry write or GPU'
        type: boolean
        default: true
      export_oci:
        description: 'Save public-source OCI archive for local transfer; contains no secrets or classroom audio'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && inputs.readiness_only && format('moss-readiness-{0}', github.run_id) || 'moss-tencent-private-image' }}
  cancel-in-progress: false
jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 135
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          file: cloud/Moss.Dockerfile
          platforms: linux/amd64
          tags: classroom-moss:check
          load: true
          push: false
      - name: Verify SCF listener and auth without starting a model
        shell: bash
        run: |
          set -euo pipefail
          token=$(openssl rand -hex 32)
          echo "::add-mask::$token"
          docker run -d --name moss-check -p 127.0.0.1:9000:9000 -e CE_MOSS_TOKEN="$token" classroom-moss:check
          python - <<'PY'
          import json, time, urllib.request, urllib.error
          for attempt in range(60):
              try:
                  urllib.request.urlopen(urllib.request.Request('http://127.0.0.1:9000/enhance', data=b'{}', headers={'Content-Type':'application/json'}), timeout=1)
                  raise AssertionError('Unauthenticated request unexpectedly accepted')
              except urllib.error.HTTPError as exc:
                  assert exc.code == 401, exc.code
                  print('SCF port 9000: unauthorized request rejected before GPU initialization')
                  break
              except (urllib.error.URLError, OSError):
                  time.sleep(.4)
          else:
              raise AssertionError('SCF listener not ready within 24 seconds')
          PY
          status=$(curl -sS -o /tmp/moss-invalid.json -w '%{http_code}' -X POST -H "Authorization: Bearer $token" -H 'Content-Type: application/json' --data '{}' http://127.0.0.1:9000/enhance)
          test "$status" = 400
          status=$(curl -sS -o /tmp/moss-cam-invalid.json -w '%{http_code}' -X POST -H 'Authorization: TC3-HMAC-SHA256 smoke-check' -H "X-CE-Moss-Token: $token" -H 'Content-Type: application/json' --data '{}' http://127.0.0.1:9000/enhance)
          test "$status" = 400
          docker stop moss-check
      - name: Measure compressed OCI layers against documented SCF default limit
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          docker buildx build --platform linux/amd64 -f cloud/Moss.Dockerfile --provenance=false --output type=oci,dest=/tmp/moss-image.tar .
          python scripts/check-moss-image.py /tmp/moss-image.tar /tmp/moss-image-readiness.json
          cat /tmp/moss-image-readiness.json
          cat /tmp/moss-image-readiness.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        with:
          name: moss-tencent-image-readiness
          path: /tmp/moss-image-readiness.json
          retention-days: 14
      - name: Split verified OCI archive for resumable local transfer
        if: ${{ success() && github.event_name == 'workflow_dispatch' && inputs.export_oci }}
        run: |
          mkdir /tmp/moss-parts
          python - <<'PYCODE'
          import hashlib,json,pathlib
          root=pathlib.Path('/tmp/moss-parts');rows=[]
          with open('/tmp/moss-image.tar','rb') as source:
              while data:=source.read(128*1024**2):
                  name=f'part-{len(rows):03d}'
                  (root/name).write_bytes(data)
                  rows.append(dict(name=name,bytes=len(data),sha256=hashlib.sha256(data).hexdigest()))
          assert 0<len(rows)<=17, 'Revisit the bounded archive part count'
          (root/'parts.json').write_text(json.dumps(rows,indent=2))
          PYCODE
      - name: Export archive part checksums
        if: ${{ success() && github.event_name == 'workflow_dispatch' && inputs.export_oci }}
        uses: actions/upload-artifact@v4
        with:
          name: moss-oci-metadata
          path: /tmp/moss-parts/parts.json
          retention-days: 3
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: ${{ success() && github.event_name == 'workflow_dispatch' && inputs.export_oci }}
        with:
          name: moss-oci-part-000
          path: /tmp/moss-parts/part-000
          compression-level: 0
          retention-days: 3
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: ${{ success() && github.event_name == 'workflow_dispatch' && inputs.export_oci }}
        with:
          name: moss-oci-part-001
          path: /tmp/moss-parts/part-001
          compression-level: 0
          retention-days: 3
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: ${{ success() && github.event_name == 'workflow_dispatch' && inputs.export_oci }}
        with:
          name: moss-oci-part-002
          path: /tmp/moss-parts/part-002
          compression-level: 0
          retention-days: 3
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: ${{ success() && github.event_name == 'workflow_dispatch' && inputs.export_oci }}
        with:
          name: moss-oci-part-003
          path: /tmp/moss-parts/part-003
          compression-level: 0
          retention-days: 3
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: ${{ success() && github.event_name == 'workflow_dispatch' && inputs.export_oci }}
        with:
          name: moss-oci-part-004
          path: /tmp/moss-parts/part-004
          compression-level: 0
          retention-days: 3
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: ${{ success() && github.event_name == 'workflow_dispatch' && inputs.export_oci }}
        with:
          name: moss-oci-part-005
          path: /tmp/moss-parts/part-005
          compression-level: 0
          retention-days: 3
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: ${{ success() && github.event_name == 'workflow_dispatch' && inputs.export_oci }}
        with:
          name: moss-oci-part-006
          path: /tmp/moss-parts/part-006
          compression-level: 0
          retention-days: 3
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: ${{ success() && github.event_name == 'workflow_dispatch' && inputs.export_oci }}
        with:
          name: moss-oci-part-007
          path: /tmp/moss-parts/part-007
          compression-level: 0
          retention-days: 3
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: ${{ success() && github.event_name == 'workflow_dispatch' && inputs.export_oci }}
        with:
          name: moss-oci-part-008
          path: /tmp/moss-parts/part-008
          compression-level: 0
          retention-days: 3
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: ${{ success() && github.event_name == 'workflow_dispatch' && inputs.export_oci }}
        with:
          name: moss-oci-part-009
          path: /tmp/moss-parts/part-009
          compression-level: 0
          retention-days: 3
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: ${{ success() && github.event_name == 'workflow_dispatch' && inputs.export_oci }}
        with:
          name: moss-oci-part-010
          path: /tmp/moss-parts/part-010
          compression-level: 0
          retention-days: 3
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: ${{ success() && github.event_name == 'workflow_dispatch' && inputs.export_oci }}
        with:
          name: moss-oci-part-011
          path: /tmp/moss-parts/part-011
          compression-level: 0
          retention-days: 3
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: ${{ success() && github.event_name == 'workflow_dispatch' && inputs.export_oci }}
        with:
          name: moss-oci-part-012
          path: /tmp/moss-parts/part-012
          compression-level: 0
          retention-days: 3
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: ${{ success() && github.event_name == 'workflow_dispatch' && inputs.export_oci }}
        with:
          name: moss-oci-part-013
          path: /tmp/moss-parts/part-013
          compression-level: 0
          retention-days: 3
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: ${{ success() && github.event_name == 'workflow_dispatch' && inputs.export_oci }}
        with:
          name: moss-oci-part-014
          path: /tmp/moss-parts/part-014
          compression-level: 0
          retention-days: 3
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: ${{ success() && github.event_name == 'workflow_dispatch' && inputs.export_oci }}
        with:
          name: moss-oci-part-015
          path: /tmp/moss-parts/part-015
          compression-level: 0
          retention-days: 3
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: ${{ success() && github.event_name == 'workflow_dispatch' && inputs.export_oci }}
        with:
          name: moss-oci-part-016
          path: /tmp/moss-parts/part-016
          compression-level: 0
          retention-days: 3
          if-no-files-found: ignore
      - name: Push pinned image without deploying or invoking a GPU
        if: ${{ success() && github.event_name == 'workflow_dispatch' && vars.CE_TCR_IMAGE != '' && !inputs.readiness_only }}
        timeout-minutes: 120
        env:
          CE_TCR_IMAGE: ${{ vars.CE_TCR_IMAGE }}
          CE_TCR_USERNAME: ${{ secrets.CE_TCR_USERNAME }}
          CE_TCR_PASSWORD: ${{ secrets.CE_TCR_PASSWORD }}
        run: |
          case "$CE_TCR_IMAGE" in
            ccr.ccs.tencentyun.com/*/*) ;;
            *) echo 'Only the configured Tencent personal registry is allowed'; exit 1 ;;
          esac
          python -m pip install --disable-pip-version-check httpx==0.28.1
          python scripts/push-moss-oci.py /tmp/moss-image.tar "$CE_TCR_IMAGE:$GITHUB_SHA" /tmp/moss-registry-transfer.json
          echo "Private Tencent image uploaded for commit $GITHUB_SHA; no SCF function created or GPU invoked." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: ${{ success() && github.event_name == 'workflow_dispatch' && vars.CE_TCR_IMAGE != '' && !inputs.readiness_only }}
        with:
          name: moss-private-registry-transfer
          path: /tmp/moss-registry-transfer.json
          retention-days: 14
      - name: Cleanup
        if: always()
        run: |
          docker logs moss-check || true
          docker rm -f moss-check || true
