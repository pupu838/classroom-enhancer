name: Classroom audio buffering hotfix

on:
  push:
    branches: [fix/audio-buffering-priority-20261025]
    paths:
      - scripts/**
      - tests/**
      - .github/workflows/buffering-hotfix.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: classroom-buffering-hotfix-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-test-and-save:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Test audio and synchronized video playback
        run: |
          node tests/multi-view-sync-test.mjs
          node tests/live-audio-test.mjs
          node tests/tablet-unified-test.cjs
      - name: Build unified iPad and desktop classroom runtime
        run: |
          node scripts/build-tablet.mjs
          node --check scripts/live-audio.mjs
          node --check scripts/multi-view-sync.mjs
          node --check scripts/multi-view-player.mjs
          node --check portal/Classroom_iPad.user.js
          node --check portal/school-connector.js
      - name: Verify manifest matches compiled runtime
        run: |
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          import { createHash } from 'node:crypto';
          const r=JSON.parse(readFileSync('portal/tablet-release.json','utf8'));
          if(r.version!=='0.10.1')throw Error('Version mismatch');
          const js=readFileSync('portal'+r.path);
          const hash=createHash('sha256').update(js).digest('hex');
          if(hash!==r.sha256)throw Error('Runtime hash mismatch');
          const source=js.toString();
          if(source.length<100000)throw Error('Unexpectedly small runtime bundle');
          JS
      - name: Save built runtime for review
        if: github.ref_name == 'fix/audio-buffering-priority-20261025'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add portal/Classroom_iPad.user.js portal/Classroom_iPad_v0.10.1.user.js portal/Classroom_iPad.meta.js portal/tablet-release.json portal/tablet/runtime/
          if ! git diff --cached --quiet; then
            git commit -m "build: generate verified classroom 0.10.1 audio hotfix runtime"
            git push
          fi
