name: Save pending classroom subtitles
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
permissions: {}
concurrency:
  group: classroom-subtitle-save
  cancel-in-progress: false
jobs:
  save:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Save completed recognition tasks
        env:
          CLASSROOM_SWEEP_TOKEN: ${{ secrets.CLASSROOM_SWEEP_TOKEN }}
        run: |
          node --input-type=module <<'JS'
          const response = await fetch('https://classroom-enhancer-global-5rcwipvd.edgeone.dev/api/classroom?op=sweep', {
            method: 'POST',
            headers: {Authorization: 'Bearer ' + process.env.CLASSROOM_SWEEP_TOKEN, 'Content-Type': 'application/json'},
            body: '{}',
            signal: AbortSignal.timeout(115000)
          });
          if (!response.ok) throw new Error('Subtitle maintenance HTTP ' + response.status);
          const result = await response.json();
          console.log(JSON.stringify({checked: result.checked, complete: result.complete, needsReview: result.needsReview}));
          JS
