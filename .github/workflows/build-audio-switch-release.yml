name: Build verified classroom 0.10.5 (normal audio hotfix)
on:
  push:
    branches: [hotfix/restore-1x-audio-0105]
    paths: ['scripts/build-tablet.mjs', 'scripts/live-audio.mjs', 'tests/normal-audio-switch-after-seek-test.mjs', '.github/workflows/build-audio-switch-release.yml']
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node tests/live-audio-test.mjs && node tests/live-audio-switch-regression-test.mjs && node tests/normal-audio-switch-after-seek-test.mjs && node tests/multi-view-sync-test.mjs
      - run: node scripts/build-tablet.mjs
      - name: Verify generated runtime digest and version
        run: |
          node --input-type=module - <<'NODE'
          import {readFileSync} from 'node:fs';
          import {createHash} from 'node:crypto';
          const m=JSON.parse(readFileSync('portal/tablet-release.json','utf8'));
          const path='portal'+m.path;
          const payload=readFileSync(path);
          if(m.version!=='0.10.5'||createHash('sha256').update(payload).digest('hex')!==m.sha256)throw Error('Runtime manifest/hash mismatch');
          if(!readFileSync('portal/Classroom_iPad.user.js','utf8').includes(m.sha256))throw Error('Fallback userscript not rebuilt');
          const html=readFileSync('portal/index.html','utf8');
          if(!html.includes('课堂助手 · v'+m.version)||!html.includes('Classroom_iPad_v'+m.version+'.user.js')||!html.includes('安装统一课堂助手 v'+m.version))throw Error('Homepage/installer version mismatch');
          if(!readFileSync(path,'utf8').includes('dataset.ceAppVersion="'+m.version+'"'))throw Error('Runtime version missing');
          if(!readFileSync('scripts/multi-view-player.mjs','utf8').includes('<option value="5">5 倍速</option>'))throw Error('5x speed selector missing');
          console.log('Verified 0.10.5 / restored normal audio',m.sha256);
          NODE
      - name: Commit verified installable release files to the fix branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add portal/tablet-release.json portal/Classroom_iPad.user.js portal/Classroom_iPad.meta.js portal/Classroom_iPad_v0.10.5.user.js portal/tablet/runtime
          if ! git diff --cached --quiet; then
            git commit -m 'build: verified 0.10.5 restored normal-speed audio runtime'
            git push origin HEAD:hotfix/restore-1x-audio-0105
          fi
