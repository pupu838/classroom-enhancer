<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Moss 降噪设备检测</title><link rel="icon" href="data:,"><style>:root{color-scheme:dark;font:17px system-ui;background:#101a29;color:#edf4ff}main{max-width:650px;margin:40px auto;padding:22px}h1{font-size:27px}p{line-height:1.7;color:#becce0}button{font:inherit;background:#315d85;color:white;border:1px solid #7ca8d3;border-radius:10px;padding:13px;margin:6px 8px 6px 0;cursor:pointer}button:disabled{opacity:.5}textarea{width:100%;box-sizing:border-box;min-height:240px;background:#152439;color:white;border:1px solid #5b7390;border-radius:10px;padding:12px}#status{color:#d3e9ff}small{color:#a9bfd5}</style><main><h1>Moss 降噪设备检测</h1><p>你选中的声音效果已保存。这里检测这台设备能否赶上回放速度，结果用于接入学校播放器；目前还未启用学校回放的 Moss 降噪。</p><p>首次需准备约 41 MB 组件，后续可使用缓存。点开始后请保持页面在前台，整个检测在后台线程运行。</p><button id="start">开始检测</button><button id="stop" disabled>停止</button><p id="status" role="status">等待开始。</p><textarea id="report" aria-label="检测结果" readonly placeholder="完成后把这里的结果发给我"></textarea><button id="copy" disabled>复制结果</button><p><small>使用你选中的同一个模型，保留完整计算精度；本页只检测速度，不更改首选参数。</small></p></main><script>
const $=id=>document.getElementById(id);let worker,timer,started=0,ticker;
function stop(){clearTimeout(timer);clearInterval(ticker);worker?.terminate();worker=null;$('start').disabled=false;$('stop').disabled=true;}
function result(value){$('report').value=JSON.stringify(value,null,2);$('copy').disabled=false;try{localStorage.setItem('ce-moss-device-result',$('report').value);}catch{}}
$('start').onclick=()=>{stop();$('start').disabled=true;$('stop').disabled=false;$('copy').disabled=true;$('report').value='';started=performance.now();let label='正在准备…';$('status').textContent=label;ticker=setInterval(()=>$('status').textContent=label+'（'+Math.floor((performance.now()-started)/1000)+'秒）',500);timer=setTimeout(()=>{stop();$('status').textContent='检测超时，已停止。';result({schema:'ce-moss-device/1',error:'检测超时',userAgent:navigator.userAgent});},120000);try{worker=new Worker('moss-check-worker.js');worker.onmessage=({data})=>{if(data.type==='progress'){label=data.label||data.stage;$('status').textContent=label;}else if(data.type==='result'){stop();result(data.report);$('status').textContent='检测完成：处理 2.5 秒内容平均用 '+data.report.computeSeconds.toFixed(2)+' 秒。请把结果发给我。';}else if(data.type==='error'){stop();$('status').textContent='检测未通过：'+data.error;result({schema:'ce-moss-device/1',error:data.error,userAgent:navigator.userAgent});}};worker.onerror=e=>{stop();$('status').textContent='检测已停止：'+e.message;result({schema:'ce-moss-device/1',error:e.message,userAgent:navigator.userAgent});};worker.postMessage({type:'start',origin:location.origin,userAgent:navigator.userAgent});}catch(e){stop();$('status').textContent=e.message;}};
$('stop').onclick=()=>{stop();$('status').textContent='已停止检测。';};$('copy').onclick=async()=>{try{await navigator.clipboard.writeText($('report').value);$('copy').textContent='已复制';}catch{$('report').focus();$('report').select();$('status').textContent='请长按或复制上方结果。';}};document.addEventListener('visibilitychange',()=>{if(document.hidden&&worker){stop();$('status').textContent='离开页面已停止检测，回来后可重新开始。';}});window.addEventListener('pagehide',stop);
try{const saved=localStorage.getItem('ce-moss-device-result');if(saved){$('report').value=saved;$('copy').disabled=false;}}catch{}
</script></html>
